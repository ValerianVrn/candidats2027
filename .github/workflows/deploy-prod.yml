name: Deploy prod

# Runs on every push to main. Code (owner releases) deploys through the `production` environment, which requires
# the owner's approval. Once the routine is live, pushes that only change content (daily data hotfixes) deploy
# through `production-data`, which needs no approval (ADR 0005). Each environment has its own Azure identity.
on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: env
        run: node scripts/deploy-env.ts "${{ github.event.before }}" "${{ github.sha }}"

  deploy:
    needs: classify
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ needs.classify.outputs.environment }}
